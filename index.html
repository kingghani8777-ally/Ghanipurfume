<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghani Perfumes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcfbfa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 450px;
            width: 90%;
        }
        h1 {
            font-size: 2.2rem;
            color: #1a1a1a;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            font-size: 1rem;
        }
        .image-box {
            width: 100%;
            height: 300px;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 20px;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* PNG transparent images ke liye 'contain' behtar rehta hai */
            transition: transform 0.3s ease;
        }
        .image-box img:hover {
            transform: scale(1.03);
        }
        .btn {
            display: inline-block;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s ease;
        }
        .btn:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ghani Perfumes</h1>
        <p>Experience the essence of luxury and elegance.</p>
        
        <!-- Yahan 'images/perfume.png' ki jagah apni PNG file ka exact naam likh dein -->
        <div class="image-box">
            <img src="images/perfume.png" alt="Ghani Perfumes Logo">
        </div>

        <a href="#shop" class="btn">Explore Collection</a>
    </div>

</body>
</html>
